name: mobogo-api

services:
  # ── API NestJS Backend (Produção) ───────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mobogo-api:latest
    container_name: mobogo-api
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-8000}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mobogo-network

  # ── Banco de Dados PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mobogo-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mobogo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mobogo}
      POSTGRES_DB: ${POSTGRES_DB:-mobogo_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-mobogo} -d $${POSTGRES_DB:-mobogo_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mobogo-network

  # ── Redis (Cache, Filas e Pub/Sub WebSockets) ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mobogo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - mobogo-network

  # ── Nginx (Proxy Reverso com suporte a WebSockets) ───────────────────────────
  nginx:
    image: nginx:alpine
    container_name: mobogo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - mobogo-network

volumes:
  postgres-data:
  redis-data:

networks:
  mobogo-network:
    driver: bridge
